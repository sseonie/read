</style><body><main class="app">
<section id="home" class="view on"><header class="top"><div><span class="ey">MEDIA JOURNAL</span><h1>My journal</h1></div><button class="round" onclick="searchOpen()">⌕</button></header><div class="card cal"><div class="calhead"><button class="arrow" onclick="move(-1)">‹</button><h2 id="month"></h2><button class="arrow" onclick="move(1)">›</button></div><div class="seg"><button class="on" onclick="modeSet('month',this)">Month</button><button onclick="modeSet('week',this)">Week</button></div><div class="chips" id="types"></div><div id="mon"><div class="weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="days" id="days"></div></div><div id="wek" hidden><div id="weekgrid" class="weekgrid"></div></div></div><div class="head"><h2>Daily log</h2><button onclick="logAdd()">+ Add log</button></div><div class="card logs" id="daily"></div><div class="head"><h2>Timeline</h2></div><div class="card logs" id="timeline"></div></section>

<script>
const K='media-journal-english',I={book:'📚',movie:'🎬',tv:'📺',pod:'🎧'},N={book:'Book',movie:'Movie',tv:'TV show',pod:'Podcast'};let selected='2026-09-10',shown=new Date(2026,8,1),ft='all',st='movie',sf='All',bf='All',pf='All',ht='all';const seed={items:[{id:'b1',type:'book',title:'Harry Potter',creator:'J.K. Rowling',genre:'Fantasy, Young Adult',status:'Reading',rating:4,total:400,current:135,notes:'I love the world building.',favorite:true},{id:'m1',type:'movie',title:'Interstellar',creator:'Christopher Nolan',genre:'Sci-fi, Space',status:'Watched',rating:5,total:169,year:'2014',notes:'The score and ending stay with me.',favorite:true},{id:'t1',type:'tv',title:'Friends',creator:'',genre:'Comedy',status:'Watching',rating:4,total:32,current:18,notes:'Easy and funny at dinner.',favorite:true},{id:'p1',type:'pod',title:'Huberman Lab',creator:'Andrew Huberman',genre:'Health, Science',status:'Listening',rating:4,total:12,current:9,notes:'Practical ideas.',favorite:true}],logs:[{id:'l1',date:'2026-09-10',type:'book',item:'b1',title:'Harry Potter',detail:'p. 102 → p. 135',amount:33},{id:'l2',date:'2026-09-10',type:'tv',item:'t1',title:'Friends',detail:'Season 1 · EP 2, EP 3',eps:2},{id:'l3',date:'2026-09-10',type:'pod',item:'p1',title:'Huberman Lab',detail:'EP102 · Sleep Better'},{id:'l4',date:'2026-09-09',type:'movie',item:'m1',title:'Interstellar',detail:'★★★★★ · First watch'},{id:'l5',date:'2026-09-08',type:'book',item:'b1',title:'Harry Potter',detail:'p. 80 → p. 102',amount:22}],goals:{book:30,movie:50,tv:100,pod:80}};let D=JSON.parse(localStorage.getItem(K)||'null')||seed;let save=()=>localStorage.setItem(K,JSON.stringify(D)),item=id=>D.items.find(x=>x.id===id),date=k=>new Date(k+'T12:00:00'),key=d=>d.toISOString().slice(0,10),status=t=>t==='book'?['All','Want to read','Reading','Read','Paused','Did not finish','Favorites']:t==='movie'?['All','Want to watch','Watched','Favorites']:t==='tv'?['All','Want to watch','Watching','Watched','Paused','Dropped','Favorites']:['All','Want to listen','Listening','Listened','Favorites'];
function go(id,e){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));e.classList.add('on');fab.style.display=id==='me'?'none':'block';render()}function move(n){shown.setMonth(shown.getMonth()+n);home()}function modeSet(x,e){document.querySelectorAll('#home .seg button').forEach(b=>b.classList.remove('on'));e.classList.add('on');mon.hidden=x==='week';wek.hidden=x==='month'}function pick(k){selected=k;home()}function logrow(x){return `<div class="log"><div class="icon">${I[x.type]}</div><div class="copy"><b>${x.title}</b><span class="sub">${x.detail}</span></div>${x.item?`<button class="fav" onclick="detail('${x.item}')">›</button>`:''}</div>`}function home(){month.textContent=shown.toLocaleDateString('en-US',{month:'long',year:'numeric'});types.innerHTML=['all','book','movie','tv','pod'].map(t=>`<button class="chip ${ft===t?'on':''}" onclick="ft='${t}';home()">${t==='all'?'All':I[t]+' '+N[t]}</button>`).join('');let y=shown.getFullYear(),m=shown.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,l=new Date(y,m+1,0).getDate(),h='';for(let i=0;i<f;i++)h+='<i></i>';for(let n=1;n<=l;n++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,a=D.logs.filter(x=>x.date===k&&(ft==='all'||x.type===ft));h+=`<button class="day ${a.length?'log':''} ${k===selected?'sel':''} ${k==='2026-09-10'?'today':''}" onclick="pick('${k}')">${n}${a.length?'<span class="dots">'+[...new Set(a.map(x=>x.type))].map(t=>'<i class="'+t+'"></i>').join('')+'</span>':''}</button>`}days.innerHTML=h;let a=D.logs.filter(x=>x.date===selected&&(ft==='all'||x.type===ft));daily.innerHTML=a.length?a.map(logrow).join(''):'<div class="empty">Nothing logged for this day.<br><button class="secondary" onclick="logAdd()">Add a record</button></div>';let g={};D.logs.filter(x=>ft==='all'||x.type===ft).forEach(x=>(g[x.date]??=[]).push(x));timeline.innerHTML=Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,4).map(([d,a])=>`<div><b class="sub" style="padding-top:9px">${date(d).toLocaleDateString('en-US',{month:'long',day:'numeric'})}</b>${a.map(logrow).join('')}</div>`).join('');let s=date(selected);s.setDate(s.getDate()-((s.getDay()+6)%7));weekgrid.innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);let a=D.logs.filter(x=>x.date===key(d)&&(ft==='all'||x.type===ft));return `<div class="wd ${a.length?'active':''}"><b>${'MTWTFSS'[i]} ${d.getDate()}</b><div class="mini">${a.map(x=>I[x.type]).join(' ')}</div></div>`}).join('')}
function filters(t,v,id){document.getElementById(id).innerHTML=status(t).map(x=>`<button class="chip ${v===x||(v==='all'&&x==='All')?'on':''}" onclick="${t==='book'?'bf':t==='pod'?'pf':'sf'}='${x}';lists()">${x}</button>`).join('')}function cards(t,v,id){let a=D.items.filter(x=>x.type===t&&(v==='all'||v==='All'||(v==='Favorites'?x.favorite:x.status===v)));document.getElementById(id).innerHTML=a.length?a.map(x=>{let p=x.total?Math.min(100,Math.round((x.current||0)/x.total*100)):0;return `<article class="card media" onclick="detail('${x.id}')"><div class="cover ${t}c">${I[t]}</div><div class="info"><h3>${x.title}</h3><p>${x.creator||x.genre||'No creator added'}</p>${x.total?`<div class="bar"><i style="width:${p}%"></i></div><p>${x.current||0} / ${x.total}${t==='book'?' pages':t==='tv'?' episodes':t==='pod'?' episodes':' min'}</p>`:`<p>${x.status}</p>`}<span class="heart">${'♥'.repeat(x.rating||0)}${'♡'.repeat(5-(x.rating||0))}</span></div><button class="fav ${x.favorite?'on':''}" onclick="event.stopPropagation();favorite('${x.id}')">${x.favorite?'♥':'♡'}</button></article>`}).join(''):'<div class="empty">No items here yet.</div>'}function lists(){filters('book',bf,'bookchips');cards('book',bf,'booklist');filters(st,sf,'screenchips');cards(st,sf,'screenlist');filters('pod',pf,'podchips');cards('pod',pf,'podlist')}function screenSet(t,e){st=t;sf='All';document.querySelectorAll('#screen .seg button').forEach(x=>x.classList.remove('on'));e.classList.add('on');lists()}function favorite(id){item(id).favorite=!item(id).favorite;save();render()}
function logAdd(t){modal.classList.add('show');sheet.innerHTML=`<button class="close" onclick="closeM()">×</button><h2>Add a record</h2><p class="sub">${date(selected).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p><div class="chips">${(t?[t]:['book','movie','tv','pod']).map(x=>`<button class="chip on" onclick="logForm('${x}')">${I[x]} ${N[x]}</button>`).join('')}</div>`}function logForm(t){let opts=D.items.filter(x=>x.type===t).map(x=>`<option value="${x.id}">${x.title}</option>`).join('');let fields=t==='book'?'<label>Start page</label><input class="field" id="a" type="number"><label>End page</label><input class="field" id="b" type="number">':t==='tv'?'<label>Episodes watched</label><div class="check" id="eps">'+Array.from({length:12},(_,i)=>`<button type="button" onclick="this.classList.toggle('on')">EP ${i+1}</button>`).join('')+'</div>':'<label>Entry note</label><input class="field" id="note" placeholder="Episode, viewing note, etc.">';sheet.innerHTML=`<button class="close" onclick="closeM()">×</button><h2>Log ${N[t]}</h2><label>Choose item</label><select class="field" id="li">${opts}<option value="">Other / not added yet</option></select><label>Title for a new item</label><input class="field" id="lt" placeholder="Title">${fields}<label>Date</label><input class="field" id="ld" type="date" value="${selected}"><button class="save" onclick="logSave('${t}')">Save record</button>`}function logSave(t){let id=li.value,x=item(id),title=x?.title||lt.value||'Untitled',detail='',amount=0,eps=0;if(t==='book'){amount=Math.max(0,(+b.value||0)-(+a.value||0));detail=`p. ${a.value||0} → p. ${b.value||0}`;if(x)x.current=Math.max(x.current||0,+b.value||0)}else if(t==='tv'){eps=document.querySelectorAll('#eps .on').length;detail=`Season 1 · ${[...document.querySelectorAll('#eps .on')].map(x=>x.textContent).join(', ')||'episode not specified'}`;if(x)x.current=(x.current||0)+eps}else detail=note?.value||'Logged';D.logs.unshift({id:'l'+Date.now(),date:ld.value,type:t,item:id,title,detail,amount,eps});selected=ld.value;save();closeM();render()}
